    --p1: #95AB78; --p2: #7FAAD6; --p3: #D98BA3; --p4: #D4B461; --p5: #A898DA;
  }
}
:root[data-theme="dark"] {

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Anthropic Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px;
}
.serif { font-family: 'Anthropic Serif', Georgia, 'Times New Roman', Times, serif; }
.mono { font-family: 'Anthropic Mono', 'JetBrains Mono', 'SF Mono', Monaco, Consolas, 'Courier New', monospace; }
a { color: var(--link); } a:hover { color: var(--accent); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav, .row, .seg, .ctl { transition: background 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
.nav:hover, .row:hover { background: var(--hover); }
.ctl:hover { border-color: var(--line-strong); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: flex; height: 100vh; background: var(--bg); }

/* Sidebar */
aside {
  width: 272px; flex-shrink: 0; background: var(--side); border-right: 0.5px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px; }
.brand-name { font-size: 18px; font-weight: 500; line-height: 1.2; }
.brand-sub { font-size: 11.5px; color: var(--muted); }
.nav {
  height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; font-size: 14px; color: var(--ink2); text-decoration: none; text-align: left; cursor: pointer;
}
.nav[aria-current="page"], .nav[aria-pressed="true"] { background: var(--active); color: var(--ink); }
.side-label { padding: 22px 10px 8px; font-size: 12px; color: var(--muted); }
.projects { display: flex; flex-direction: column; gap: 2px; }
.projects .nav { height: 34px; width: 100%; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
.nav-label { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.spacer { flex-grow: 1; min-height: 24px; }
.side-foot { display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.side-foot .nav { padding: 0 8px; }
.seg-group { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--track); }
.seg {
  flex: 1 1 0; height: 30px; display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: 7px; background: transparent; font-size: 13px; color: var(--ink2); cursor: pointer;
}
.seg:hover { color: var(--ink); }

.row { display: flex; align-items: center; gap: 24px; padding: 16px 14px; margin: 0 -14px; border-radius: 10px; }

.metrics { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
.metric { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; white-space: nowrap; }
.metric b { font-weight: 400; font-size: 13px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.metric.cost b { font-weight: 500; }
.metric span { font-size: 11px; line-height: 1.2; color: var(--muted); }
.m-dur { width: 56px; } .m-tok { width: 64px; } .m-cost { width: 72px; }
.empty { padding: 40px 0; text-align: center; font-size: 14px; color: var(--muted); }

@media (max-width: 900px) {
  .app { flex-direction: column; height: auto; min-height: 100vh; }
  aside { width: auto; border-right: 0; border-bottom: 0.5px solid var(--line); overflow: visible; }
  .projects { flex-direction: row; overflow-x: auto; }
  .projects .nav { width: auto; flex-shrink: 0; max-width: 240px; }
  .spacer { display: none; }
  .side-foot { flex-direction: row; align-items: center; justify-content: space-between; padding-top: 16px; }
  main { overflow: visible; }
  .content { width: calc(100% - 32px); padding-top: 32px; }
  .head { flex-direction: column; align-items: flex-start; }
  .menu { left: 0; right: auto; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 0.5px solid var(--line); }
  .row { flex-direction: column; align-items: stretch; gap: 12px; }
  .metrics { justify-content: space-between; }
}
</style>
</head>

<script>
// ── Theme: follows the system until a choice is made, then remembers it ──
const root = document.documentElement;
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const themeButtons = document.querySelectorAll('[data-theme-choice]');
function showTheme() {
  const theme = root.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
  themeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === theme)));
}
themeButtons.forEach(b => b.addEventListener('click', () => {
  root.dataset.theme = b.dataset.themeChoice;
  try { localStorage.setItem('theme', b.dataset.themeChoice); } catch (e) {}
  showTheme();
}));
darkQuery.addEventListener('change', showTheme);
showTheme();

// ── Formatting ──
function fmtTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}
function fmtDuration(s) {
  if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return m ? `${h}h ${m}m` : `${h}h`; }
  return s >= 60 ? `${Math.floor(s / 60)}m` : `${s}s`;
}
function fmtStart(secs) {
  if (!secs) return '—';
  const d = new Date(secs * 1000), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const REASONS = {
  prompt_input_exit: 'Exited',
  clear: 'Cleared with /clear',
  resume: 'Switched with /resume',
  logout: 'Logged out',
  other: 'Ended',
};
const RANGES = [
  { value: 'all', label: 'All time', days: 0 },
  { value: '7', label: 'Last 7 days', days: 7 },
  { value: '30', label: 'Last 30 days', days: 30 },
  { value: '90', label: 'Last 90 days', days: 90 },
  { value: '365', label: 'Last year', days: 365 },
];
const PALETTE = 6; // --p0 … --p5

// Builds an element; text is only ever set through textContent.
function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ── Data ──
// history.js sits next to this page: one h([...]) call per finished session,
// [id, project, model, start, duration, tokens_in, tokens_cache, tokens_out, cost, reason].
// A later line with the same id replaces an earlier one (resumed sessions).
let rows = new Map();
let anonymous = 0;
function h(r) {
  if (Array.isArray(r)) rows.set(r[0] ? `id:${r[0]}` : `anon:${anonymous++}`, r);
}

// Re-adding the script tag re-reads the file, so new sessions show up without reopening the page.
let pending = null;
function loadHistory() {
  if (pending) return;
  rows = new Map();
  anonymous = 0;
  pending = document.createElement('script');
  pending.src = `history.js?t=${Date.now()}`;
  pending.onload = pending.onerror = () => {
    pending.remove();
    pending = null;
    render();
  };
  document.body.appendChild(pending);
}

// ── State ──
const view = { project: 'all', range: 'all', q: '' };

// ── Time frame menu ──
const tf = document.getElementById('tf');
const menu = document.getElementById('tf-menu');
const menuItems = RANGES.map(r => {
  const b = el('button', 'mi');
  b.type = 'button';
  b.setAttribute('role', 'menuitemradio');
  b.append(el('span', '', r.label));
  b.append(el('span', 'check'));
  b.addEventListener('click', () => { view.range = r.value; closeMenu(); render(); });
  menu.append(b);
  return b;
});
// Check icon built with DOM calls; the page never parses markup from strings.
const checkIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
checkIcon.setAttribute('width', '16'); checkIcon.setAttribute('height', '16'); checkIcon.setAttribute('viewBox', '0 0 24 24');
checkIcon.setAttribute('fill', 'none'); checkIcon.setAttribute('stroke', 'currentColor'); checkIcon.setAttribute('stroke-width', '2');
checkIcon.setAttribute('stroke-linecap', 'round'); checkIcon.setAttribute('stroke-linejoin', 'round'); checkIcon.setAttribute('aria-hidden', 'true');
const checkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
checkPath.setAttribute('d', 'M5 12.5l4.5 4.5L19 7.5');
checkIcon.append(checkPath);
menuItems.forEach(b => b.querySelector('.check').append(checkIcon.cloneNode(true)));

function openMenu() {
  menu.hidden = false;
  tf.setAttribute('aria-expanded', 'true');
  (menuItems.find(b => b.getAttribute('aria-checked') === 'true') || menuItems[0]).focus();
}
function closeMenu(refocus) {
  menu.hidden = true;
  tf.setAttribute('aria-expanded', 'false');
  if (refocus) tf.focus();
}
tf.addEventListener('click', () => (menu.hidden ? openMenu() : closeMenu()));
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && !tf.contains(e.target)) closeMenu(); });
menu.addEventListener('keydown', e => {
  const i = menuItems.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); menuItems[(i + 1) % menuItems.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); menuItems[(i - 1 + menuItems.length) % menuItems.length].focus(); }
  else if (e.key === 'Tab') closeMenu();
});

document.getElementById('q').addEventListener('input', e => { view.q = e.target.value; render(); });

// ── Render ──
function projectNav(label, value, color, count) {
  const b = el('button', 'nav');
  b.type = 'button';
  b.setAttribute('aria-pressed', String(view.project === value));
  const dot = el('span', 'dot');
  dot.style.background = color;
  b.append(dot, el('span', 'nav-label', label), el('span', 'nav-count', String(count)));
  b.title = label;
  b.addEventListener('click', () => { view.project = value; render(); });
  return b;
}

function metric(value, label, cls, title) {
  const m = el('span', `metric ${cls}`);
  const v = el('b', 'mono', value);
  if (title) m.title = title;
  m.append(v, el('span', '', label));
  return m;
}

function render() {
  const all = [...rows.values()].map(r => ({
    project: String(r[1] || '') || 'unknown', model: String(r[2] || ''), start: Number(r[3]) || 0,
    dur: Number(r[4]) || 0, tin: Number(r[5]) || 0, tcache: Number(r[6]) || 0,
    tout: Number(r[7]) || 0, cost: Number(r[8]) || 0, reason: String(r[9] || ''),
  })).sort((a, b) => b.start - a.start);

  // Colors follow alphabetical order, so a project keeps its color as sessions come and go.
  const names = [...new Set(all.map(s => s.project))].sort();
  const color = name => `var(--p${names.indexOf(name) % PALETTE})`;

  const rg = RANGES.find(r => r.value === view.range) || RANGES[0];
  const cutoff = Date.now() / 1000 - rg.days * 86400;
  const inRange = all.filter(s => !rg.days || s.start >= cutoff);
  if (view.project !== 'all' && !names.includes(view.project)) view.project = 'all';
  const scoped = inRange.filter(s => view.project === 'all' || s.project === view.project);
  const q = view.q.trim().toLowerCase();
  const list = scoped.filter(s => !q ||
    `${REASONS[s.reason] || s.reason} ${s.reason} ${s.project} ${s.model}`.toLowerCase().includes(q));
  const sum = (arr, key) => arr.reduce((acc, s) => acc + s[key], 0);

  // Sidebar projects, busiest first
  const counts = new Map(names.map(n => [n, inRange.filter(s => s.project === n).length]));
  const byCount = [...names].sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
  document.getElementById('projects').replaceChildren(
    projectNav('All projects', 'all', 'var(--muted)', inRange.length),
    ...byCount.map(n => projectNav(n, n, color(n), counts.get(n))));

  // Header and time frame
  document.getElementById('range-label').textContent = rg.label;
  tf.setAttribute('aria-label', `Time frame: ${rg.label}`);
  menuItems.forEach((b, i) => b.setAttribute('aria-checked', String(RANGES[i].value === rg.value)));
  const when = !rg.days ? ', all time' : rg.days === 365 ? ' in the last year' : ` in the last ${rg.days} days`;
  document.getElementById('scope').textContent =
    `Claude Code usage across ${view.project === 'all' ? 'all projects' : view.project}${when}`;

  // Overview
  const total = sum(scoped, 'cost');
  const cache = sum(scoped, 'tcache');
  document.getElementById('s-sessions').textContent = String(scoped.length);
  document.getElementById('s-in').textContent = fmtTokens(sum(scoped, 'tin'));
  document.getElementById('s-in-note').textContent = cache ? `+ ${fmtTokens(cache)} cache reads` : 'input tokens';
  document.getElementById('s-out').textContent = fmtTokens(sum(scoped, 'tout'));
  document.getElementById('s-spend').textContent = '$' + total.toFixed(2);

  // Spend by project: the five biggest, the rest grouped
  const spend = document.getElementById('spend');
  spend.hidden = view.project !== 'all' || total <= 0;
  if (!spend.hidden) {
    const costs = names.map(n => ({ label: n, color: color(n), cost: sum(scoped.filter(s => s.project === n), 'cost') }))
      .filter(p => p.cost > 0).sort((a, b) => b.cost - a.cost);
    const parts = costs.length > 6
      ? [...costs.slice(0, 5), { label: `${costs.length - 5} more`, color: 'var(--muted)', cost: sum(costs.slice(5), 'cost') }]
      : costs;
    document.getElementById('spend-total').textContent = '$' + total.toFixed(2);
    document.getElementById('spend-bar').replaceChildren(...parts.map(p => {
      const d = el('div');
      d.style.width = `${(p.cost / total) * 100}%`;
      d.style.background = p.color;
      d.title = `${p.label}: $${p.cost.toFixed(3)}`;
      return d;
    }));
    document.getElementById('spend-legend').replaceChildren(...parts.map(p => {
      const d = el('div');
      const sw = el('span', 'sw');
      sw.style.background = p.color;
      d.append(sw, document.createTextNode(p.label), el('span', 'mono', '$' + p.cost.toFixed(3)));
      return d;
    }));
  }

  // Session log
  document.getElementById('count').textContent = `${list.length} ${list.length === 1 ? 'session' : 'sessions'}`;
  const rowsEl = document.getElementById('rows');
  if (list.length === 0) {
    rowsEl.replaceChildren(el('div', 'empty',
      all.length === 0 ? 'No sessions recorded yet. A session appears here when it ends.'
        : q ? 'No sessions match that search.' : 'No sessions in this time frame.'));
    return;
  }
  rowsEl.replaceChildren(...list.map(s => {
    const row = el('div', 'row');
    const main = el('div', 'row-main');
    const proj = el('span', 'proj');
    const dot = el('span', 'dot');
    dot.style.background = color(s.project);
    proj.append(dot, document.createTextNode(s.project));
    const meta = el('div', 'meta');
    meta.append(proj, el('span', '', '·'), el('span', 'chip mono', s.model || 'unknown'),
      el('span', '', '·'), el('span', 'mono', fmtStart(s.start)));
    meta.children[1].setAttribute('aria-hidden', 'true');
    meta.children[3].setAttribute('aria-hidden', 'true');
    main.append(el('div', 'row-title', REASONS[s.reason] || s.reason || 'Ended'), meta);
    const metrics = el('div', 'metrics');
    metrics.append(
      metric(fmtDuration(s.dur), 'duration', 'm-dur'),
      metric(fmtTokens(s.tin), 'tokens in', 'm-tok', s.tcache ? `${s.tin.toLocaleString()} input + ${s.tcache.toLocaleString()} cache reads` : ''),
      metric(fmtTokens(s.tout), 'tokens out', 'm-tok'),
      metric('$' + s.cost.toFixed(4), 'cost', 'm-cost cost'));
    row.append(main, metrics);
    return row;
  }));
}

window.addEventListener('focus', loadHistory);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadHistory(); });
setInterval(() => { if (!document.hidden) loadHistory(); }, 15000);
loadHistory();
</script>
</body>
</html>
