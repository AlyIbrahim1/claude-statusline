[package]
name = "claude-statusline"
version = "1.4.6"
edition = "2021"
description = "Rich statusline for Claude Code — model, context bar, real-time token tracking, git branch, rate limits, and session stats."
homepage = "https://github.com/AlyIbrahim1/claude-statusline"
repository = "https://github.com/AlyIbrahim1/claude-statusline"
license = "MIT"

[[bin]]
name = "statusline"
path = "src/main.rs"

[dependencies]
serde_json = "1"
open = "5.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
