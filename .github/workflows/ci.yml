name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-version-alignment.js

  test-js:
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node node_modules/jest/bin/jest.js

  test-rust:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo test -- --test-threads=1

  test-rust-windows:
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -- --test-threads=1

  dispatch-release:
    needs: [test-js, test-rust, test-rust-windows]
    if: |
      needs.test-js.result == 'success' &&
      needs.test-rust.result == 'success' &&
      needs.test-rust-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for version tag on this commit
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1)
          echo "name=$TAG" >> $GITHUB_OUTPUT
      - name: Dispatch release if tagged
        if: steps.tag.outputs.name != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'release-ready',
              client_payload: {
                tag: '${{ steps.tag.outputs.name }}',
                sha: context.sha
              }
            })
