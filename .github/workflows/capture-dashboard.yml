name: Capture Dashboard Design

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard-design/**'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-save http-server playwright
          npx playwright install --with-deps chromium

      - name: Serve and Capture
        run: |
          npx http-server ./dashboard-design -p 8080 &
          SERVER_PID=$!
          sleep 3
          node .github/scripts/capture-dashboard.js
          kill $SERVER_PID

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update dashboard screenshot [skip ci]"
          file_pattern: '.github/assets/dashboard-preview.png'
