name: Capture Dashboard Design

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard-design/**'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --no-save http-server playwright
          npx playwright install --with-deps chromium

      - name: Serve and Capture
        run: |
          npx http-server ./dashboard-design -p 8080 &
          SERVER_PID=$!
          sleep 3
          node .github/scripts/capture-dashboard.js
          kill $SERVER_PID

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update dashboard screenshot [skip ci]"
          file_pattern: '.github/assets/dashboard-preview.png'
