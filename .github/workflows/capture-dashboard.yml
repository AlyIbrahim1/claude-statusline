name: Capture Dashboard Design

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard-design/**'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -D http-server playwright
          npx playwright install --with-deps chromium

      - name: Create assets directory
        run: mkdir -p assets

      - name: Serve and Capture
        run: |
          npx http-server ./dashboard-design -p 8080 &
          SERVER_PID=$!
          sleep 3
          node .github/scripts/capture-dashboard.js
          kill $SERVER_PID

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update dashboard screenshot [skip ci]"
          file_pattern: 'assets/dashboard-preview.png'
