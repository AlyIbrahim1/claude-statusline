name: Release

# Pushing a v* tag releases it. Order of gates, each blocking everything after it:
#   verify        tag == package.json version, all versions aligned, tag commit is on main
#   ci            the full CI workflow against the tagged commit
#   build         each platform binary built and run on its own OS/arch (nothing published yet)
#   publish-binaries  platform packages (harmless alone: nothing installs them directly)
#   smoke-install npm install -g of the root package on every platform, using the published binaries
#   publish-root  the package users install; only after all of the above passed
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag matches the committed versions
        run: |
          VERSION=${RELEASE_TAG#v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG. Bump the version, commit, then tag."
            exit 1
          fi
          node scripts/check-version-alignment.js
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$RELEASE_TAG points at a commit that is not on main."
            exit 1
          fi
      - name: Version is not already fully released
        run: |
          VERSION=${RELEASE_TAG#v}
          if npm view "@alyibrahim/claude-statusline@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@alyibrahim/claude-statusline@$VERSION is already on npm. Bump the version."
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          # Every binary is built on a runner that can execute it, so each one is run before publishing.
          - { pkg: linux-x64,    os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  bin: statusline }
          - { pkg: linux-arm64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bin: statusline }
          - { pkg: darwin-x64,   os: macos-15-intel,   target: x86_64-apple-darwin,        bin: statusline }
          - { pkg: darwin-arm64, os: macos-14,         target: aarch64-apple-darwin,       bin: statusline }
          - { pkg: win32-x64,    os: windows-latest,   target: x86_64-pc-windows-msvc,     bin: statusline.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Run the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          OUT=$(echo '{"session_id":"smoke","model":{"display_name":"SmokeModel"},"workspace":{"current_dir":"."}}' | "$BIN")
          echo "$OUT"
          grep -q SmokeModel <<<"$OUT"
          echo '{}' | "$BIN" hook start
      - name: Linux binary is static
        if: runner.os == 'Linux'
        run: file "target/${{ matrix.target }}/release/statusline" | tee /dev/stderr | grep -q 'static'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 7

  publish-binaries:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. No token: npm exchanges
      # the job's OIDC identity for a short-lived publish credential. The npm package settings
      # trust this workflow file in the `npm` environment.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Publish platform packages
        run: |
          VERSION=${RELEASE_TAG#v}
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            cp artifacts/$pkg/* packages/$pkg/
            chmod 755 packages/$pkg/statusline* # artifacts do not keep the executable bit
            (cd packages/$pkg && npm version "$VERSION" --no-git-tag-version --allow-same-version)
            # Re-runs of a partly failed release skip what is already published.
            if npm view "@alyibrahim/claude-statusline-$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "@alyibrahim/claude-statusline-$pkg@$VERSION already published, skipping"
            else
              npm publish "packages/$pkg/" --access public --provenance
            fi
          done

  smoke-install:
    needs: publish-binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Wait for the platform package on the registry
        shell: bash
        run: |
          PKG="@alyibrahim/claude-statusline-$(node -p 'process.platform + "-" + process.arch')@${RELEASE_TAG#v}"
          for i in $(seq 1 30); do
            npm view "$PKG" version >/dev/null 2>&1 && exit 0
            echo "waiting for $PKG ($i)"; sleep 10
          done
          echo "::error::$PKG never appeared on the registry"; exit 1
      - run: node .github/scripts/smoke-install.js --expect-binary

  publish-root:
    needs: smoke-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Trusted publishing: see publish-binaries.
      - run: npm install -g npm@11
      - run: npm publish --access public --provenance
